# GitHub Pages deploy – statinė DI Promptų Biblioteka
# Reikalavimas: Repo Settings → Pages → Build and deployment: GitHub Actions
# Nuoroda: https://github.com/DITreneris/spinoff01 (QA standartas)

name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build locale pages (lt/en) for the GitHub Pages mirror
        # MIRROR_NOTE=1 omits the EN paid-PDF storefront (#pdf-storefront)
        # from this build. Paid checkout, webhook, and downloads only run on
        # promptanatomy.space (Vercel) - never on the GitHub Pages mirror.
        # Buyers always go to https://promptanatomy.space for purchases.
        run: npm run build
        env:
          BASE_PATH: ''
          SITE_ORIGIN: 'https://promptanatomy.space'
          MIRROR_NOTE: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          # Static allowlist from scripts/vercel-export-public.js only.
          # Never path: . — that published docs/, api/, and data/ on the mirror.
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: IndexNow ping (non-blocking)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run seo:indexnow:diff
